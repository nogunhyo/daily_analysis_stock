# ─────────────────────────────────────────────────────────────
# AI 에이전트 대중화 → "병목(bottleneck)"과 "해자(moat)" 종목 유니버스
#
# - 병목: 수요는 폭증하는데 공급을 빨리 늘릴 수 없는 구간 (가격 결정력 ↑)
# - 해자: 경쟁자가 쉽게 따라올 수 없는 구조적 우위 (기술 독점, 전환비용, 규모)
#
# 종목 추가/삭제는 universe 목록만 수정하면 됩니다.
#   ticker : 야후 파이낸스 티커 (한국 코스피 = 종목코드.KS, 코스닥 = 종목코드.KQ)
#   market : US 또는 KR (벤치마크·호가단위·통화 표시에 사용)
#   layer  : 어떤 병목 구간에 속하는지
#   thesis : 투자 아이디어 한 줄 (리포트에 그대로 표시됨)
# 아래 thesis는 2026년 중반까지 공개된 정보 기준의 요약이므로 주기적으로 점검하세요.
# ─────────────────────────────────────────────────────────────

settings:
  top_n: 3                      # 매일 추천 종목 수 (조건 충족 종목이 적으면 더 적게 나감)
  max_per_layer: 1              # 같은 병목 구간(layer의 '·' 앞부분)에서 최대 몇 종목까지 추천할지 (상관관계 분산)
  risk_per_trade_pct: 1.0       # 1회 매매에서 감수할 손실 = 계좌의 1% (1차 진입분이 손절될 때 기준)
  max_first_tranche_pct: 25.0   # 1차 진입 비중 상한 (계좌 대비 %)
  pyramid_split: [50, 30, 20]   # 1차 / 2차(+1R) / 3차(+2R) 비중 비율
  target_r: 3                   # 1차 목표 = 진입가 + 3R
  atr_period: 14
  pivot_lookback: 20            # 피벗 = 최근 20거래일 최고가
  min_base_days: 5              # 피벗 이후 최소 5거래일 횡보해야 '진짜 돌파'로 인정 (연속 신고가는 제외)
  stop_lookback: 10             # 구조적 손절 = 최근 10거래일 최저가 아래
  min_stop_atr: 1.0             # 손절폭 최소 1 ATR (노이즈에 털리지 않게)
  max_stop_atr: 2.0             # 손절폭 최대 2 ATR
  breakout_buy_range_pct: 5     # 돌파 후 피벗 +5% 이내까지만 매수 허용
  near_pivot_pct: 5             # 피벗까지 5% 이내면 '돌파 대기'
  extended_atr: 3.0             # 21일 EMA보다 3 ATR 이상 위면 '과열'
  extended_sma50_pct: 25        # 50일선보다 25% 이상 위면 '과열'
  breakout_volume_ratio: 1.4    # 돌파일 거래량 ≥ 50일 평균의 1.4배면 '거래량 동반'
  max_risk_pct_warn: 10         # 손절폭이 10% 넘으면 경고
  earnings_warn_days: 7         # 실적발표 7일 이내면 경고·감점

ai:
  enabled: true                 # ANTHROPIC_API_KEY 가 없으면 자동으로 건너뜀
  model: claude-opus-5-5
  effort: medium                # low / medium / high
  max_searches: 8               # 하루 웹검색 최대 횟수 (비용 상한)

benchmarks:
  US: QQQ                       # 나스닥100 ETF
  KR: 069500.KS                 # KODEX 200 (코스피200 ETF)

universe:
