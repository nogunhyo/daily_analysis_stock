name: Daily AI-Agent Stock Report

on:
  schedule:
    # 월~토 06:50 KST (= 일~금 21:50 UTC). GitHub 스케줄은 수 분~수십 분 늦게 시작될 수 있어
    # 07시 도착을 목표로 10분 일찍 잡음. 일요일은 새 시세가 없어 제외.
    - cron: "50 21 * * 0-5"
  workflow_dispatch:
    inputs:
      no_ai:
        description: "AI 코멘트 생략"
        type: boolean
        default: false
      dry_run:
        description: "텔레그램 발송 없이 시험 실행 (추천 기록 저장까지만)"
        type: boolean
        default: false

permissions:
  contents: write   # 추천 결과 스냅샷(reports/)을 저장소에 기록하기 위해 필요

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pip install pytest && python -m pytest -q

      - name: Generate and send report
        id: report
        env:
          # GitHub Secret 이름은 TELEGRAM_*, 프로그램은 STOCK_TELEGRAM_* 를 읽음
          STOCK_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          STOCK_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: >-
          python -m stock_agent --json reports/latest.json
          ${{ inputs.no_ai && '--no-ai' || '' }}
          ${{ inputs.dry_run && '--dry-run' || '' }}

      # 보낸 리포트와 똑같은 추천 결과를 저장소에 기록
      # - 07:07 Claude 코멘트 루틴이 이 파일을 읽어 같은 종목을 해설 (다시 계산하면 결과가 달라질 수 있음)
      # - 날짜별 파일이 쌓여 나중에 추천 성과를 복기할 수 있음
      # 실패해도 리포트 발송에는 영향 없도록 continue-on-error
      - name: Save picks snapshot
        if: steps.report.outcome == 'success'
        continue-on-error: true
        run: |
          d=$(TZ=Asia/Seoul date +%F)
          cp reports/latest.json "reports/$d.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          git commit -q -m "Add picks snapshot $d" || { echo "변경 없음"; exit 0; }
          git pull -q --rebase && git push -q

      # 설치·테스트 단계에서 실패하면 리포트 스크립트가 실행되지 않으므로 여기서 알림
      # (리포트 스크립트 자체 실패는 스크립트가 직접 알림을 보냄)
      - name: Notify setup failure
        if: failure() && steps.report.outcome != 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # 파이썬 쪽(read_token/read_chat_id)과 같은 방식으로 값 정리: 공백 제거 후 토큰·숫자 부분만 추출
          token=$(printf %s "$TELEGRAM_BOT_TOKEN" | tr -d '[:space:]' | grep -oE '[0-9]{5,}:[A-Za-z0-9_-]{35}' | head -1)
          chat=$(printf %s "$TELEGRAM_CHAT_ID" | tr -d '[:space:]' | grep -oE -- '-?[0-9]{5,}' | tail -1)
          curl -sS --fail-with-body -o /dev/null -X POST "https://api.telegram.org/bot${token}/sendMessage" \
            -d chat_id="${chat}" \
            --data-urlencode text="❌ 오늘 리포트 준비 단계(설치/테스트) 실패: ${RUN_URL}"
